[build-system]
requires = [
    "poetry-core==2.4.1",
]
build-backend = "poetry.core.masonry.api"

[project]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "anyio>=4.4.0",
    "cryptography==50.0.1",
    "httpx==0.28.1",
    "mashumaro==3.22",
    "msal==1.38.0",
    "requests>=2.32.2",
]
description = "The Liminal SDK for Python"
license = "Apache-2.0"
name = "liminal-sdk-python"
readme = "README.md"
requires-python = ">=3.12,<3.15"
version = "2024.09.0b1"

[project.optional-dependencies]
all = [
    "liminal-sdk-python[build,lint,release,test]",
]
build = [
    "uv==0.12.8",
]
lint = [
    "blacken-docs==1.20.0",
    "codespell==2.4.3",
    "darglint==1.8.1",
    "pre-commit-hooks==6.0.0",
    "pre-commit==4.6.2",
    "pytest-asyncio==1.4.0",
    "pytest==9.1.1",
    "ruff==0.16.5",
    "ty==0.0.77",
]
release = [
    "tomli==2.4.1",
    "tomli-w==1.2.0",
]
test = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-httpx==0.36.2",
]

[tool.coverage.report]
exclude_lines = [
    "TYPE_CHECKING",
    "raise NotImplementedError",
]
fail_under = 100
show_missing = true

[tool.coverage.run]
source = [
    "liminal",
]

[tool.poetry]
authors = [
    "Liminal AI <info@liminal.ai>",
]
packages = [
    { include = "liminal" },
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
future-annotations = true
ignore = [
    "A005",    # Shadowing a Python standard-library module
    "CPY001",  # Missing copyright notice at top of file; we don't use header notices
    "D202",    # No blank lines allowed after function docstring
    "D203",    # 1 blank line required before class docstring
    "D213",    # Multi-line docstring summary should start at the second line
    "PLR0913", # This is subjective
    "PLR0917", # This is subjective (positional-argument variant of PLR0913)
    "PLW2901", # Outer {outer_kind} variable {name} overwritten by inner {inner_kind} target
    "PT012",   # `pytest.raises()` block should contain a single simple statement
    "S603",    # Nearly every subprocess call raises this; silly
    "TCH",     # flake8-type-checking

    # May conflict with the formatter:
    # https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "COM812",
    "COM819",
    "D206",
    "D300",
    "E111",
    "E114",
    "E117",
    "ISC001",
    "ISC002",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "W191",
]
select = [
    "ALL"
]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
known-first-party = [
    "liminal",
    "tests",
]
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"examples/*" = [
    "ASYNC250",
]
"tests/*" = [
    "ARG001",
    "FBT001",
    "PLR2004",
    "S101",
    "SLF001",
]

[tool.ty.environment]
python = "./.venv"
python-version = "3.12"

[tool.vulture]
min_confidence = 100
sort_by_size = true
